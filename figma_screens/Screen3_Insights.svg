<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="700" rx="0" fill="#F3F5F8"/><rect x="0" y="0" width="1000" height="52" rx="0" fill="#1F3A5F"/><text x="20" y="32" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-style="normal">Emotion Context Explorer</text><rect x="420" y="12" width="78" height="32" rx="6" fill="#1F3A5F"/><text x="459.0" y="33" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">Browse</text><rect x="506" y="12" width="158" height="32" rx="6" fill="#1F3A5F"/><text x="585.0" y="33" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="normal" text-anchor="middle" font-style="normal">Utterance detail</text><rect x="672" y="12" width="94" height="32" rx="6" fill="#fff"/><text x="719.0" y="33" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle" font-style="normal">Insights</text><rect x="16" y="656" width="968" height="32" rx="6" fill="#FFF4DD" stroke="#E0B040" stroke-width="1"/><text x="28" y="676" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B4A00" font-weight="normal" text-anchor="start" font-style="normal">Model predictions are estimates and may not reflect the speaker's actual emotion. Adding context lowered overall accuracy in our evaluation.</text><rect x="16" y="68" width="233" height="96" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="30" y="92" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start" font-style="normal">Accuracy · Audio</text><text x="30" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">45.7% → 25.8%</text><text x="30" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#C62828" font-weight="bold" text-anchor="start" font-style="normal">−19.86 pp</text><rect x="259" y="68" width="233" height="96" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="273" y="92" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start" font-style="normal">Accuracy · Text</text><text x="273" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">54.2% → 42.5%</text><text x="273" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#C62828" font-weight="bold" text-anchor="start" font-style="normal">−11.73 pp</text><rect x="502" y="68" width="233" height="96" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="516" y="92" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start" font-style="normal">Predictions changed</text><text x="516" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">54.28% audio</text><text x="516" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#B26A00" font-weight="bold" text-anchor="start" font-style="normal">42.23% text</text><rect x="745" y="68" width="233" height="96" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="759" y="92" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="start" font-style="normal">Corrected vs broken</text><text x="759" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="19" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">Audio 148 vs 529</text><text x="759" y="148" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#C62828" font-weight="bold" text-anchor="start" font-style="normal">Text 155 vs 380</text><rect x="16" y="180" width="480" height="300" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="30" y="204" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">Macro-F1 by condition</text><text x="30" y="254" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Audio-only</text><rect x="150" y="236" width="191.66834592098886" height="26" rx="4" fill="#4C72B0"/><text x="349.6683459209888" y="255" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">0.319</text><text x="30" y="308" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Audio + context</text><rect x="150" y="290" width="128.50271243359265" height="26" rx="4" fill="#DD8452"/><text x="286.50271243359265" y="309" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">0.214</text><text x="30" y="362" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Text-only</text><rect x="150" y="344" width="244.2911367061713" height="26" rx="4" fill="#4C72B0"/><text x="402.2911367061713" y="363" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">0.407</text><text x="30" y="416" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Text + context</text><rect x="150" y="398" width="215.79266391647556" height="26" rx="4" fill="#DD8452"/><text x="373.7926639164756" y="417" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">0.360</text><text x="30" y="456" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="normal" text-anchor="start" font-style="italic">Adding context lowered Macro-F1 for both modalities.</text><rect x="512" y="180" width="472" height="300" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="526" y="204" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">Label shift with audio context (utterances)</text><text x="526" y="258" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">anger</text><rect x="600" y="232" width="132.92307692307693" height="18" rx="3" fill="#4C72B0"/><text x="738.9230769230769" y="246" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">540</text><rect x="600" y="256" width="297.10769230769233" height="18" rx="3" fill="#DD8452"/><text x="903.1076923076923" y="270" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">1207</text><text x="526" y="316" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">neutral</text><rect x="600" y="290" width="201.6" height="18" rx="3" fill="#4C72B0"/><text x="807.6" y="304" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">819</text><rect x="600" y="314" width="18.70769230769231" height="18" rx="3" fill="#DD8452"/><text x="624.7076923076924" y="328" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">76</text><text x="526" y="374" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">joy</text><rect x="600" y="348" width="51.2" height="18" rx="3" fill="#4C72B0"/><text x="657.2" y="362" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">208</text><rect x="600" y="372" width="85.9076923076923" height="18" rx="3" fill="#DD8452"/><text x="691.9076923076923" y="386" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">349</text><text x="526" y="432" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">sadness</text><rect x="600" y="406" width="63.50769230769231" height="18" rx="3" fill="#4C72B0"/><text x="669.5076923076923" y="420" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">258</text><rect x="600" y="430" width="60.55384615384615" height="18" rx="3" fill="#DD8452"/><text x="666.5538461538462" y="444" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">246</text><rect x="600" y="456" width="12" height="12" rx="2" fill="#4C72B0"/><text x="618" y="467" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">No context</text><rect x="700" y="456" width="12" height="12" rx="2" fill="#DD8452"/><text x="718" y="467" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">With context</text><rect x="16" y="496" width="968" height="150" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="30" y="520" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">What this means</text><circle cx="38" cy="546" r="3" fill="#1F3A5F"/><text x="50" y="551" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Context changed many predictions, but most changes were harmful: 529 correct audio predictions were broken and 148 were corrected.</text><circle cx="38" cy="574" r="3" fill="#1F3A5F"/><text x="50" y="579" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">With audio context the model predicted "anger" for 62.9% of utterances, although only 13.4% are anger in MELD.</text><circle cx="38" cy="602" r="3" fill="#1F3A5F"/><text x="50" y="607" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2937" font-weight="normal" text-anchor="start" font-style="normal">Treat context-conditioned labels as estimates: compare them with the no-context label before relying on them.</text></svg>