" width="222" height="130" rx="8" fill="#EEF4FF" stroke="#1F3A5F" stroke-width="1.8"/><text x="74" y="386" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">TARGET UTTERANCE · id 2</text><text x="74" y="418" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">Y'know what?</text><rect x="74" y="468" width="198" height="18" rx="9" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><polygon points="82,472 82,482 91,477" fill="#1F3A5F"/><line x1="100" y1="477" x2="260" y2="477" stroke="#CBD5E1" stroke-width="3"/><text x="30" y="540" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7280" font-weight="normal" text-anchor="start" font-style="italic">Exactly what the model received:</text><text x="30" y="558" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7280" font-weight="normal" text-anchor="start" font-style="italic">2 preceding utterances + target.</text><rect x="308" y="100" width="470" height="330" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="322" y="124" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">Model predictions</text><text x="442" y="150" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="middle" font-style="normal">No context</text><text x="688" y="150" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#6B7280" font-weight="bold" text-anchor="middle" font-style="normal">With context</text><text x="322" y="218" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="start" font-style="normal">Audio</text><rect x="372" y="162" width="140" height="104" rx="10" fill="#fff" stroke="#2E7D32" str