c">Reference for ✓ / ✗ marks</text><rect x="790" y="266" width="194" height="164" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="804" y="290" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1F2937" font-weight="bold" text-anchor="start" font-style="normal">How to read</text><text x="804" y="316" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E7D32" font-weight="bold" text-anchor="start" font-style="normal">✓  matches MELD</text><text x="804" y="340" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#C62828" font-weight="bold" text-anchor="start" font-style="normal">✗  differs from MELD</text><text x="804" y="364" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#B26A00" font-weight="bold" text-anchor="start" font-style="normal">≠  changed by context</text><text x="804" y="388" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7280" font-weight="bold" text-anchor="start" font-style="normal">=  unchanged</text><text x="804" y="414" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#6B7280" font-weight="normal" text-anchor="start" font-style="italic">Colour is never the only cue.</text></svg>